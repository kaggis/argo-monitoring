openapi: 3.0.3
info:
  title: Monitoring Federating Capability API
  description: |
    API for retrieving monitoring capability data for a node's top-level services: metrics (availability, reliability, uptime), status timelines, downtimes, issues and a combined summary.
   
  version: 3.0.0
servers:
- url: https://api.node.foo/v3
tags:
- name: summary
  description: Combined at-a-glance view of status, metrics, downtimes and issues per service
- name: metrics
  description: Availability, reliability and uptime metrics
- name: status
  description: Status timelines of the node's services
- name: downtimes
  description: Scheduled or recorded downtime windows
- name: issues
  description: Recorded monitoring issues
paths:
  /monitoring/metrics:
    get:
      tags: [metrics]
      operationId: listMetrics
      summary: List metrics for all services
      description: |
        Returns metrics for all node's top level services
      parameters:
      - $ref: '#/components/parameters/NameFilter'
      - $ref: '#/components/parameters/SearchFilter'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - $ref: '#/components/parameters/Granularity'
      - $ref: '#/components/parameters/MetricFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Metrics results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsListResponse'
              example:
                data:
                - id: argo-mon
                  name: argo-moninitoring
                  results:
                  - date: '2026-07-02'
                    availability: 97.5
                    reliability: 100
                    uptime: 97.5
                - id: argo-msg
                  name: argo-msg
                  results:
                  - date: '2026-07-02'
                    availability: 100
                    reliability: 100
                    uptime: 100
                page:
                  limit: 50
                  offset: 0
                  total: 2
        '400':
          $ref: '#/components/responses/BadRequest'
  /monitoring/metrics/{service-id}:
    get:
      tags: [metrics]
      operationId: getServiceMetrics
      summary: Get metrics for a single service
      description: |
        Metrics for one service. 
      parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - $ref: '#/components/parameters/Granularity'
      - $ref: '#/components/parameters/MetricFilter'
      responses:
        '200':
          description: Metrics results for the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsListResponse'
              example:
                data:
                - id: argo-mon
                  name: argo-monitoring
                  results:
                  - date: '2026-07-02'
                    availability: 97.5
                    reliability: 100
                    uptime: 97.5
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /monitoring/status:
    get:
      tags: [status]
      operationId: listStatus
      summary: List status timelines for all services
      description: |
        Returns the status timelines for node's top level services
      parameters:
      - $ref: '#/components/parameters/NameFilter'
      - $ref: '#/components/parameters/SearchFilter'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Status results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusListResponse'
              example:
                data:
                - id: argo-mon
                  name: argo-mon
                  results:
                  - timestamp: '2026-07-02T00:00:00Z'
                    state: OK
                  - timestamp: '2026-07-02T06:49:32Z'
                    state: OK
                - id: argo-msg
                  name: argo-msg
                  results:
                  - timestamp: '2026-07-02T00:00:00Z'
                    state: WARNING
                  - timestamp: '2026-07-02T06:49:32Z'
                    state: CRITICAL
                page:
                  limit: 50
                  offset: 0
                  total: 2
        '400':
          $ref: '#/components/responses/BadRequest'
  /monitoring/status/{service-id}:
    get:
      tags: [status]
      operationId: getServiceStatus
      summary: Get status for a single service
      description: |
        Current state (one result) when no date range is supplied, or the
        status timeline over the given range.
      parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Status results for the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusListResponse'
              example:
                data:
                - id: argo-mon
                  name: argo-monintoring
                  results:
                  - timestamp: '2026-07-02T00:00:00Z'
                    state: OK
                  - timestamp: '2026-07-02T06:49:32Z'
                    state: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /monitoring/downtimes:
    get:
      tags: [downtimes]
      operationId: listDowntimes
      summary: List downtimes for all services
      description: |
        Returns downtime windows overlapping the given date range. Defaults to
        active and upcoming downtimes when no range is supplied.
      parameters:
      - $ref: '#/components/parameters/NameFilter'
      - $ref: '#/components/parameters/SearchFilter'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Downtime results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DowntimesListResponse'
              example:
                data:
                - id: argo-mon
                  name: argo-monintoring
                  results:
                  - name: Scheduled maintenance
                    description: Database upgrade window
                    startTime: '2026-06-28T02:00:00Z'
                    endTime: '2026-06-28T04:00:00Z'
                page:
                  limit: 50
                  offset: 0
                  total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
  /monitoring/downtimes/{service-id}:
    get:
      tags: [downtimes]
      operationId: getServiceDowntimes
      summary: Get downtimes for a specific service
      description: |
        Return downtimes for a specific service
      parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Downtime results for the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DowntimesListResponse'
              example:
                data:
                - id: argo-mon
                  name: argo-monintoring
                  results:
                  - name: Scheduled maintenance
                    description: Database upgrade window
                    startTime: '2026-06-28T02:00:00Z'
                    endTime: '2026-06-28T04:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /monitoring/issues:
    get:
      tags: [issues]
      operationId: listIssues
      summary: List issues for all services
      description: |
        Returns issues for node's top level services
      parameters:
      - $ref: '#/components/parameters/NameFilter'
      - $ref: '#/components/parameters/SearchFilter'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Issue results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuesListResponse'
              example:
                data:
                - id: argo-mon
                  name: argo-monintoring
                  results:
                  - timestamp: '2026-07-01T14:22:10Z'
                    status: CRITICAL
                    host: argo-mon-api-03
                    source: argo-mon-api
                    message: certificate expired - could not connect
                page:
                  limit: 50
                  offset: 0
                  total: 1
        '400':
          $ref: '#/components/responses/BadRequest'
  /monitoring/issues/{service-id}:
    get:
      tags: [issues]
      operationId: getServiceIssues
      summary: Get issues for a single service
      description: |
        Returns issues for a specific service
      parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/StartDate'
      - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: Issue results for the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuesListResponse'
              example:
                data:
                - id: argo-mon
                  name: argo-mon
                  results:
                  - timestamp: '2026-07-01T14:22:10Z'
                    status: WARNING
                    host: argo-mon-api-03
                    source: argo-mon-api
                    message: p99 latency exceeded 2s threshold
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /monitoring/summary:
    get:
      tags: [summary]
      operationId: getSummary
      summary: Get monitoring summary for all services
      description: |
        Combined at-a-glance view (current status, today's metrics, active or
        upcoming downtimes, recent issues) for the node's services.
      parameters:
      - $ref: '#/components/parameters/NameFilter'
      - $ref: '#/components/parameters/SearchFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Summary results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
              example:
                data:
                - id: argo-mon
                  name: argo-mon
                  status: OK
                  metrics:
                    availability: 100
                    reliability: 100
                    uptime: 100
                  downtimes: []
                  issues: []
                - id: argo-msg
                  name: argo-msg
                  status: CRITICAL
                  metrics:
                    availability: 97.2
                    reliability: 100
                    uptime: 97.2
                  downtimes: []
                  issues:
                  - timestamp: '2026-07-02T09:10:00Z'
                    status: CRITICAL
                    host: argo-msg-mq-01
                    source: message-queue
                    message: Consumer lag exceeded 5000 messages
                page:
                  limit: 50
                  offset: 0
                  total: 2
        '400':
          $ref: '#/components/responses/BadRequest'
  /monitoring/summary/{service-id}:
    get:
      tags: [summary]
      operationId: getServiceSummary
      summary: Get summary for a single service
      description: |
        Combined at-a-glance view (current status, today's metrics, active or
        upcoming downtimes, recent issues) for a specific service
      parameters:
      - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Summary result for the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
              example:
                data:
                - id: argo-mon
                  name: argo-mon
                  status: OK
                  metrics:
                    availability: 100
                    reliability: 100
                    uptime: 100
                  downtimes: []
                  issues: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ServiceId:
      name: service-id
      in: path
      required: true
      description: |
        Service id
      schema:
        type: string
        pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
        maxLength: 128
      example: argo-mon
    NameFilter:
      name: name
      in: query
      required: false
      description: |
        Filter to one or more services by exact name. Repeat the parameter for
        multiple services
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      example: [argo-mon, argo-msg]
    SearchFilter:
      name: search
      in: query
      required: false
      description: Case-insensitive substring match on service name.
      schema:
        type: string
      example: argo
    StartDate:
      name: start-date
      in: query
      required: false
      description: |
        Start of a date range (inclusive, UTC). Must be supplied together with
        `end-date`. For a single day, set both to the same value. Maximum
        range is 92 days.
      schema:
        type: string
        format: date
      example: '2026-06-01'
    EndDate:
      name: end-date
      in: query
      required: false
      description: |
        End of a date range (inclusive, UTC). Must be supplied together with
        `start-date` and must not precede it.
      schema:
        type: string
        format: date
      example: '2026-06-30'
    Granularity:
      name: granularity
      in: query
      required: false
      description: Daily or monthly aggregation of metrics.
      schema:
        type: string
        enum: [daily, monthly]
        default: daily
    MetricFilter:
      name: metric
      in: query
      required: false
      description: |
        Filter to one or more metric types. Repeat the parameter for multiple
        types. Omit to receive all metric types.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [availability, reliability, uptime]
      example: [availability, uptime]
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of services to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Number of services to skip. 
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    State:
      type: string
      description: Monitoring state.
      enum: [OK, WARNING, CRITICAL, UNKNOWN, MISSING]
      example: OK
    PageInfo:
      type: object
      required: [limit, offset]
      properties:
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
        total:
          type: integer
          description: |
            Total number of services
          example: 137
    MetricsEntry:
      type: object
      required: [id, name, results]
      properties:
        id:
          type: string
          description: Service's id
          example: argo-mon
        name:
          type: string
          description: name of the service.
          example: argo-mon
        results:
          type: array
          description: Sorted by `date` ascending.
          items:
            $ref: '#/components/schemas/MetricResult'
    MetricResult:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
          description: Date expressed in YYYY-MM-DD or YYYY-MM (when monthly results)
          example: '2026-07-02'
        availability:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage.
          example: 97.5
        reliability:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage.
          example: 100
        uptime:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage.
          example: 97.5
    StatusEntry:
      type: object
      required: [id, name, results]
      properties:
        id:
          type: string
          description: Service id
          example: argo-mon
        name:
          type: string
          description: Name of the service
          example: argo-mon
        results:
          type: array
          description: Status resutls sorted chronologically
          items:
            $ref: '#/components/schemas/StatusResult'
    StatusResult:
      type: object
      required: [timestamp, state]
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-07-02T06:49:32Z'
        state:
          $ref: '#/components/schemas/State'
    DowntimesEntry:
      type: object
      required: [id, name, results]
      properties:
        id:
          type: string
          description: Service's id
          example: argo-mon
        name:
          type: string
          description: Service's name
          example: argo-mon
        results:
          type: array
          description: List of relevant downtimes chronologically sorted
          items:
            $ref: '#/components/schemas/DowntimeResult'
    DowntimeResult:
      type: object
      required: [startTime, endTime]
      properties:
        name:
          type: string
          description: Short title of the downtime window.
          example: Scheduled maintenance
        description:
          type: string
          example: Database upgrade window
        startTime:
          type: string
          format: date-time
          example: '2026-06-28T02:00:00Z'
        endTime:
          type: string
          format: date-time
          example: '2026-06-28T04:00:00Z'
    IssuesEntry:
      type: object
      required: [id, name, results]
      properties:
        id:
          type: string
          description: Service's id
          example: argo-mon
        name:
          type: string
          description: Service's name
          example: argo-mon
        results:
          type: array
          description: List of issues chronologically sorted
          items:
            $ref: '#/components/schemas/IssueResult'
    IssueResult:
      type: object
      required: [timestamp, status, message]
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-07-01T14:22:10Z'
        status:
          $ref: '#/components/schemas/State'
        host:
          type: string
          example: argo-mon-api-03
        source:
          type: string
          example: argo-mon-api
        message:
          type: string
          description: Monitoring message produced by the check.
          example: certificate expired - could not connect
    ItemSummary:
      type: object
      required: [id, name, status, metrics, downtimes, issues]
      properties:
        id:
          type: string
          description: Service's id
          example: argo-mon
        name:
          type: string
          description: Service's name
          example: argo-mon
        status:
          $ref: '#/components/schemas/State'
        metrics:
          $ref: '#/components/schemas/SummaryMetrics'
        downtimes:
          type: array
          description: List of relevant downtimes chronologically sorted
          items:
            $ref: '#/components/schemas/DowntimeResult'
        issues:
          type: array
          description: List of relevant issues chronologically sorted
          items:
            $ref: '#/components/schemas/IssueResult'
    SummaryMetrics:
      type: object
      properties:
        availability:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage
          example: 99
        reliability:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage
          example: 100
        uptime:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage
          example: 99
    MetricsListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MetricsEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    StatusListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StatusEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    DowntimesListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DowntimesEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    IssuesListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IssuesEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    SummaryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'
        page:
          $ref: '#/components/schemas/PageInfo'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: INVALID_DATE_RANGE
        message:
          type: string
          example: end-date must not precede start-date
  responses:
    BadRequest:
      description: |
        Invalid request. Examples: `start-date` without `end-date` (or vice
        versa), `end-date` before `start-date`, malformed date, or `limit`/`offset` outside their allowed bounds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Service not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
